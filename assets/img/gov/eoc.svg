<?xml version="1.0" encoding="UTF-8"?>
<!-- 🏛️ شعار صندوق تعويضات أفراد الهيئة التعليمية (مخترَع 2026-10-19 «اخترعلهن واحد» — لا شعار رسمياً منشوراً):
     قرص كحلي بحلقة ذهبية، أرزة خضراء فوق، وصندوق ذهبي مفتوح فيه عملات = «صندوق» + لبنان. بلا أحمر ولا برتقالي. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4f7e"/><stop offset="1" stop-color="#173f6f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8d5a3"/><stop offset="1" stop-color="#c9a961"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#g)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#c9a961" stroke-width="7"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#e8d5a3" stroke-width="1.5" opacity=".6"/>
  <!-- الأرزة -->
  <g fill="#2e8b57">
    <path d="M100 30 L86 50 H94 L80 66 H92 L74 84 H126 L108 66 H120 L106 50 H114 Z"/>
    <rect x="96" y="84" width="8" height="12"/>
  </g>
  <!-- الصندوق -->
  <g>
    <rect x="50" y="118" width="100" height="46" rx="6" fill="url(#gold)" stroke="#8a6d2f" stroke-width="3"/>
    <path d="M50 118 Q100 96 150 118" fill="#e8d5a3" stroke="#8a6d2f" stroke-width="3"/>
    <rect x="50" y="118" width="100" height="8" fill="#8a6d2f" opacity=".35"/>
    <rect x="93" y="126" width="14" height="16" rx="3" fill="#173f6f"/>
    <circle cx="100" cy="131" r="3" fill="#e8d5a3"/>
  </g>
  <!-- العملات -->
  <g stroke="#8a6d2f" stroke-width="2">
    <circle cx="68" cy="112" r="9" fill="#e8d5a3"/>
    <circle cx="84" cy="106" r="9" fill="#e8d5a3"/>
    <circle cx="116" cy="106" r="9" fill="#e8d5a3"/>
    <circle cx="132" cy="112" r="9" fill="#e8d5a3"/>
  </g>
</svg>
